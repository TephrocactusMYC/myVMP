name: Release candidate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag and version
        if: github.ref_type == 'tag'
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
      - name: Install release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang python3 binutils \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf
      - name: Build release candidate
        run: make release-check package
      - name: Build corresponding source archive
        run: |
          version="$(cat VERSION)"
          git archive --format=tar.gz --prefix="myvmp-${version}/" \
            -o "build/dist/myvmp-${version}-source.tar.gz" HEAD
      - name: Create checksum manifest
        run: cd build/dist && sha256sum myvmp-*-linux-*-tool.tar.gz myvmp-*-source.tar.gz > SHA256SUMS
      - name: Upload unsigned candidate
        uses: actions/upload-artifact@v4
        with:
          name: myvmp-${{ github.ref_name }}-unsigned-candidate
          path: |
            build/dist/myvmp-*-linux-*-tool.tar.gz
            build/dist/myvmp-*-source.tar.gz
            build/dist/SHA256SUMS
          if-no-files-found: error

# Maintainers verify this candidate, then create the detached OpenPGP signature and
# publish all files manually according to RELEASING.md. CI does not hold a release key.
