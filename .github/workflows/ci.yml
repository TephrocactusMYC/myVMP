name: Quality Gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STRICT_CXXFLAGS: >-
    -std=c++20 -O2 -g -Wall -Wextra -Wpedantic -Werror
    -Wformat=2 -Wundef -Wshadow -Wcast-align -Wnon-virtual-dtor

jobs:
  repository-hygiene:
    name: Repository and source hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject tracked generated or ignored files
        shell: bash
        run: |
          set -euo pipefail
          tracked_ignored="$(git ls-files -ci --exclude-standard)"
          if [[ -n "$tracked_ignored" ]]; then
            printf '%s\n' 'Tracked files match .gitignore:' "$tracked_ignored" >&2
            exit 1
          fi
      - name: Check source style
        run: python3 scripts/check_style.py
      - name: Check documentation
        run: python3 scripts/check_docs.py
      - name: Check Python syntax
        run: python3 -m compileall -q scripts
      - name: Check shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck scripts/*.sh
      - name: Check whitespace errors
        run: git diff --check HEAD

  host-build:
    name: Strict host build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3
      - name: Compile with warnings as errors
        run: make -j"$(nproc)" CXXFLAGS="$STRICT_CXXFLAGS" all
      - name: Run host tests and metadata checks
        run: make CXXFLAGS="$STRICT_CXXFLAGS" test version-check
