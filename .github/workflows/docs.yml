name: Publish documentation

on:
  push:
    branches: [master, main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "scripts/check_mermaid_site.py"
  workflow_dispatch:

concurrency:
  group: github-pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish MkDocs site
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out documentation sources
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pinned MkDocs and Material theme
        run: python -m pip install --disable-pip-version-check "mkdocs==1.6.1" "mkdocs-material==9.7.7"

      - name: Verify Mermaid diagrams are emitted
        run: |
          set -euxo pipefail
          python -m mkdocs build --strict
          python scripts/check_mermaid_site.py site

      - name: Build strictly and publish to gh-pages
        run: python -m mkdocs gh-deploy --force --strict --remote-branch gh-pages
